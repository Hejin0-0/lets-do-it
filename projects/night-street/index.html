<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>night-street</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0c; }
      canvas { display: block; width: 100%; height: 100%; }

      #start {
        position: fixed; inset: 0; z-index: 10;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 1.5rem; background: #0a0a0c; color: #d8cfc4;
        font: 400 14px/1.7 ui-monospace, "SF Mono", Menlo, monospace;
        letter-spacing: 0.06em; cursor: pointer; user-select: none;
        transition: opacity 0.6s ease;
      }
      #start.hidden { opacity: 0; pointer-events: none; }
      #start h1 { font-size: 13px; font-weight: 400; color: #e8a35c; letter-spacing: 0.3em; }
      #start table { border-collapse: collapse; color: #8d857c; }
      #start td { padding: 0.15rem 0.9rem 0.15rem 0; }
      #start td:first-child { color: #d8cfc4; text-align: right; }
      #start .cta { margin-top: 0.5rem; color: #e8a35c; }
      #start .note { color: #5d574f; font-size: 12px; max-width: 34ch; text-align: center; }

      #hud {
        position: fixed; left: 14px; bottom: 12px; z-index: 5;
        font: 400 11px/1.6 ui-monospace, "SF Mono", Menlo, monospace;
        color: rgba(216, 207, 196, 0.34); letter-spacing: 0.08em;
        pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      }
      #loading {
        position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
        background: #0a0a0c; color: #6b645b;
        font: 400 12px/1 ui-monospace, Menlo, monospace; letter-spacing: 0.25em;
      }
    </style>
  </head>
  <body>
    <div id="loading">BUILDING STREET</div>

    <div id="start" class="hidden">
      <h1>NIGHT STREET</h1>
      <table>
        <tr><td>W A S D</td><td>walk</td></tr>
        <tr><td>SHIFT</td><td>run</td></tr>
        <tr><td>MOUSE</td><td>look</td></tr>
        <tr><td>ESC</td><td>release cursor</td></tr>
      </table>
      <div class="cta">click to walk</div>
      <div class="note">
        Everything you are about to see is generated in code. No images, no models, no audio files.
      </div>
    </div>

    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
